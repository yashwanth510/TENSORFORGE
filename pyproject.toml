[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorforge"
version = "0.1.0"
description = "CPU tensors, automatic differentiation, and neural networks through modern Transformers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/yashwanth510/TENSORFORGE"
Issues = "https://github.com/yashwanth510/TENSORFORGE/issues"

[tool.setuptools.packages.find]
include = ["tensorforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
