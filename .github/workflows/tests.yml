name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytorch-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and reference test dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,reference]'
      - name: Require PyTorch and run reference comparisons
        run: |
          python -c 'import torch; print(torch.__version__)'
          python -m pytest tests/test_pytorch_reference.py -v
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Run tests
        id: tests
        run: python -m pytest --junitxml="$RUNNER_TEMP/test-results.xml"
      - name: Report test failures
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'test-results.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = (failure.text or failure.get('message', 'Test failed'))[-6000:]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('name', 'Test failure')}::{message}")
          PY
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tensorforge-wheel"
          "$RUNNER_TEMP/tensorforge-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tensorforge-wheel/bin/python" -c 'import tensorforge as tf; x=tf.tensor([1.,2.],requires_grad=True); (x*x).sum().backward(); assert x.grad.tolist()==[2.,4.]'
